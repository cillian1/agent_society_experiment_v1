<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Society Hub</title>
<style>
:root{--bg:#14171c;--panel:#1d2229;--line:#2e3641;--text:#e6e9ee;--dim:#8d97a5;--accent:#ffd93d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0;margin-right:auto}
button,select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
main{display:flex;gap:16px;padding:16px;flex-wrap:wrap;align-items:flex-start}
#left{flex:1 1 640px;min-width:0}#right{flex:0 1 420px;min-width:300px;width:100%;max-width:520px}
canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;display:block;cursor:pointer;image-rendering:pixelated}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 9px;border-radius:99px;border:2px solid transparent;background:#2a313a;cursor:pointer}
.chip.sel{border-color:var(--accent)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.dim{color:var(--dim)}.bar{height:6px;background:#2a313a;border-radius:3px;overflow:hidden;margin:3px 0 8px}
.bar>div{height:100%}.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-bottom:8px}
.thought{background:#252c35;border-left:3px solid var(--accent);padding:8px 10px;border-radius:4px;margin:6px 0}
.scroll{max-height:300px;overflow:auto}.hist{padding:7px 0;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}.tag{font-size:12px;color:var(--dim)}
.legend{display:flex;gap:14px;margin-top:8px;color:var(--dim);font-size:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
</style></head><body>
<header><h1>Agent Society Hub</h1><span id="tick" class="dim">tick 0</span>
<span id="usage" class="dim" style="cursor:help">usage: –</span>
<button id="pause">Pause</button>
<label class="dim">speed <select id="speed"><option value="2">slow</option><option value="1" selected>normal</option><option value="0.3">fast</option></select></label></header>
<main><div id="left"><canvas id="c"></canvas>
<div class="legend"><span><i style="background:#4e9a47"></i>grass</span><span><i style="background:#2f6fb5"></i>water</span><span><i style="background:#d9c88a"></i>sand</span><span><i style="background:#7b7f86"></i>rock</span><span><i style="background:#4e9a47;box-shadow:inset 0 0 0 3px #d62f4b"></i>food</span><span>click an agent to inspect</span></div></div>
<div id="right"><div class="panel"><h2>Agents</h2><div class="chips" id="chips"></div></div>
<div class="panel" id="detail"><h2>Agent</h2><div class="dim">Click an agent on the map or in the list.</div></div>
<div class="panel"><h2>World feed</h2><div class="scroll" id="feed"></div></div></div></main>
<script>
const T=22,COL={grass:'#4e9a47',water:'#2f6fb5',sand:'#d9c88a',rock:'#7b7f86',food:'#4e9a47'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let histHTML='<div class="dim">loading…</div>',W=0,H=0,tiles=[],agents=[],disp={},sel=null,state={};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shade=(x,y)=>((x*73856093^y*19349663)>>>0)%100/100;
async function j(u,o){return (await fetch(u,o)).json()}
function size(){cv.width=W*T;cv.height=H*T}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const t=tiles[y][x];ctx.fillStyle=COL[t];ctx.fillRect(x*T,y*T,T,T);
    ctx.fillStyle=`rgba(${shade(x,y)>.5?'255,255,255':'0,0,0'},.05)`;ctx.fillRect(x*T,y*T,T,T);
    if(t==='food'){ctx.fillStyle='#d62f4b';[[7,8],[14,7],[11,14]].forEach(([a,b])=>{ctx.beginPath();ctx.arc(x*T+a,y*T+b,3,0,7);ctx.fill()})}
    if(t==='rock'){ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(x*T+4,y*T+13,T-8,5)}
  }
  for(const a of agents){
    const d=disp[a.name]||(disp[a.name]={x:a.x,y:a.y});d.x+=(a.x-d.x)*.2;d.y+=(a.y-d.y)*.2;
    const px=d.x*T+T/2,py=d.y*T+T/2;
    if(sel===a.name){ctx.strokeStyle='#ffd93d';ctx.lineWidth=3;ctx.beginPath();ctx.arc(px,py,T/2+1,0,7);ctx.stroke()}
    ctx.fillStyle=a.color;ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.beginPath();ctx.arc(px,py,T/2-3,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#111';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(a.name[0],px,py+.5);
    ctx.font='11px system-ui';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.strokeText(a.name,px,py+T/2+6);ctx.fillStyle='#fff';ctx.fillText(a.name,px,py+T/2+6);
    if(a.say){const s=a.say.length>40?a.say.slice(0,38)+'…':a.say;ctx.font='11px system-ui';const w=ctx.measureText(s).width+12,bx=Math.min(Math.max(px-w/2,2),cv.width-w-2),by=py-T-14;
      ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(bx,by,w,18,5);ctx.fill();ctx.fillStyle='#111';ctx.fillText(s,bx+w/2,by+9.5)}
  }
  requestAnimationFrame(draw)
}
cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)*cv.width/r.width/T,my=(e.clientY-r.top)*cv.height/r.height/T;
  let best=null,bd=1.2;for(const a of agents){const d=disp[a.name]||a,k=Math.hypot(d.x+.5-mx,d.y+.5-my);if(k<bd){bd=k;best=a.name}}
  if(best)select(best)});
function select(n){sel=n;histHTML='<div class="dim">loading…</div>';renderChips();renderDetail();loadHistory()}
function renderChips(){document.getElementById('chips').innerHTML=agents.map(a=>`<span class="chip ${sel===a.name?'sel':''}" onclick="select('${a.name}')"><span class="dot" style="background:${a.color}"></span>${esc(a.name)}</span>`).join('')}
function bar(label,v,col){return `<div class="tag">${label} ${v}/100</div><div class="bar"><div style="width:${v}%;background:${col}"></div></div>`}
function renderDetail(){
  const a=agents.find(x=>x.name===sel),el=document.getElementById('detail');if(!a)return;
  const l=a.latest;
  el.innerHTML=`<h2>${esc(a.name)} · ${esc(a.role)}</h2>
  <div class="kv"><span class="dim">Goal</span><span>${esc(a.goal)}</span><span class="dim">Model</span><span>${esc(a.model||'default')}</span>
  <span class="dim">Position</span><span>(${a.x}, ${a.y})</span><span class="dim">Food carried</span><span>${a.food}</span><span class="dim">Skills</span><span>${esc(a.skills.join(', '))}</span></div>
  ${bar('Hunger',a.hunger,a.hunger>70?'#e0525e':a.hunger>40?'#e0a252':'#6bcB77')}
  ${Object.entries(a.traits).map(([k,v])=>`<span class="tag">${k.slice(0,4)} ${(v*100)|0}</span>`).join(' · ')}
  <h2 style="margin-top:12px">Currently</h2>
  ${l?`<div class="thought">💭 ${esc(l.thought)}</div><div><b>${esc(l.action)}</b> <span class="dim">→ ${esc(l.result)}</span></div>`:'<div class="dim">No actions yet.</div>'}
  <h2 style="margin-top:12px">History (newest first)</h2><div class="scroll" id="hist">${histHTML}</div>`}
async function loadHistory(){
  if(!sel)return;const h=await j('/api/history?name='+encodeURIComponent(sel)),el=document.getElementById('hist');
  histHTML=h.slice().reverse().map(e=>`<div class="hist"><span class="tag">t${e.tick} · (${e.x},${e.y}) · hunger ${e.hunger}</span><div>💭 ${esc(e.thought)}</div><div><b>${esc(e.action)}</b> <span class="dim">→ ${esc(e.result)}</span></div></div>`).join('')||'<div class="dim">none yet</div>';if(el)el.innerHTML=histHTML}
async function poll(){
  try{const s=await j('/api/state');state=s;agents=s.agents;tiles=s.tiles;
    document.getElementById('tick').textContent='tick '+s.tick;document.getElementById('pause').textContent=s.paused?'Resume':'Pause';
    if(!document.getElementById('chips').children.length||document.getElementById('chips').children.length!==agents.length)renderChips();
    renderUsage(s.usage);if(sel)renderDetail();
    document.getElementById('feed').innerHTML=s.events.slice().reverse().map(e=>`<div class="hist"><span class="tag">t${e.tick}</span> <span class="dot" style="background:${e.color}"></span><b>${esc(e.agent)}</b> ${esc(e.text)}</div>`).join('')||'<div class="dim">quiet so far…</div>'}catch(e){}
  setTimeout(poll,600)}
const fmt=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':n;
function renderUsage(u){const el=document.getElementById('usage');if(!u)return;
  el.textContent=`${u.calls} calls · ${fmt(u.input)} in / ${fmt(u.output)} out tokens`+(u.cost!=null?` · ~$${u.cost.toFixed(3)}`:'');
  el.title=Object.entries(u.models).map(([m,x])=>`${m}: ${x.calls} calls, ${x.input} in, ${x.output} out`+(x.cost!=null?`, ~$${x.cost.toFixed(4)}`:'')).join('\n')||'no calls yet'}
async function histLoop(){await loadHistory();setTimeout(histLoop,1500)}
document.getElementById('pause').onclick=()=>j('/api/control',{method:'POST',body:JSON.stringify({paused:!state.paused})});
document.getElementById('speed').onchange=e=>j('/api/control',{method:'POST',body:JSON.stringify({interval:+e.target.value})});
(async()=>{const w=await j('/api/world');W=w.width;H=w.height;tiles=w.tiles;size();draw();poll();histLoop()})();
</script></body></html>
